name: npm-publish

on:
  push:
    branches:
      - '**'
      - '!master'

jobs:
  build:

    name: npm-publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Is there an open PR for this branch?
      id: openpr
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        count=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq 'length')
        echo "count=$count" >> "$GITHUB_OUTPUT"
        if [ "$count" != "0" ]; then
          echo "Open PR found for ${{ github.ref_name }}; pull-request.yml covers this push." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Install dependencies
      if: steps.openpr.outputs.count == '0'
      run: npm ci --force

    - name: Build
      if: steps.openpr.outputs.count == '0'
      run: npm run build -- --configuration=production

    - name: Test
      if: steps.openpr.outputs.count == '0'
      run: npx nx run-many -t test --all --coverage --parallel=2 --output-style=stream

    - name: Rebase coverage paths to workspace-relative
      if: steps.openpr.outputs.count == '0'
      run: node tools/scripts/rebase-lcov-paths.mjs

    - name: Upload coverage
      if: steps.openpr.outputs.count == '0'
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/libs/*/lcov.info
          coverage/apps/*/lcov.info
        disable-search: true
        flags: branch
        finish: true
        fail-ci-if-error: false
