name: npm-publish

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: 
  contents: read
  packages: write 

jobs:
  build:

    name: npm-publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build -- --configuration=production

    - name: Test
      run: npx nx run-many -t test --all --coverage --parallel=2 --output-style=stream

    - name: Rebase coverage paths to workspace-relative
      run: node tools/scripts/rebase-lcov-paths.mjs

    - name: Upload coverage
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/libs/*/lcov.info
          coverage/apps/*/lcov.info
        disable-search: true
        flags: unit
        finish: true
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@fc5aa28d12bea9a9c91afee290e13cf586184714 # versioning-v1

    # Publishes every package under dist/libs whose version the registry lacks, under the
    # dist-tag the versioning step wrote (publishConfig.tag).
    - name: Publish to NPM + GitHub Packages
      uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
      with:
        folder: dist/libs
        registries: |
          [
            { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}" },
            { "url": "https://npm.pkg.github.com", "token": "${{ github.token }}" }
          ]

    # Publish to GitHub Container Registry
    - name: Authenticate with GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta-ghcr
      uses: docker/metadata-action@v5
      with:
        github-token: ${{ github.token }}
        images: ghcr.io/${{ github.repository }}
    
    - name: Publish to Github Container Registry
      id: push-ghcr
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-ghcr.outputs.tags }}
        labels: ${{ steps.meta-ghcr.outputs.labels }}

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ steps.push-ghcr.outputs.digest }}
        push-to-registry: true

    #- name: Trigger deploy hook
    #  uses: fjogeleit/http-request-action@v1
    #  with:
    #    url: ${{ secrets.SLIPLANE_DEPLOY_HOOK }}
    #    method: GET
